name: Research worker

on:
  schedule:
    - cron: "0 * * * *"      # hourly, UTC
  workflow_dispatch:
  repository_dispatch:
    types: [research_request]

concurrency:
  group: research-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install dependencies
        run: pip install -r worker/requirements.txt
      - name: Run worker
        working-directory: worker
        run: python worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JUDGE_PROVIDER: ${{ secrets.JUDGE_PROVIDER || 'groq' }}
          ANALYST_PROVIDER: ${{ secrets.ANALYST_PROVIDER || 'gemini' }}
          FALLBACK_PROVIDER: ${{ secrets.FALLBACK_PROVIDER || 'openrouter' }}
